name: Build iOS IPA

# Builds an unsigned .ipa of the iOS app. Sign it yourself before installing.

on:
  push:
    branches:
      - iphone-hybrid-mouse
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner label
        default: macos-latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.runner }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unsigned-ipa:
    name: Build unsigned iOS IPA
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Xcode and SDK versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun --sdk iphoneos --show-sdk-version

      - name: Ensure iOS platform is installed
        run: xcodebuild -downloadPlatform iOS || true

      - name: Build unsigned archive
        run: |
          set -o pipefail
          xcodebuild \
            -project Moonlight.xcodeproj \
            -scheme Moonlight \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Moonlight.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Moonlight.xcarchive/Products/Applications/Moonlight.app"
          if [ ! -d "$APP" ]; then
            echo "Moonlight.app not found in archive:" >&2
            ls -la "$RUNNER_TEMP/Moonlight.xcarchive/Products/Applications" >&2 || true
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry Moonlight-hybrid-mouse.ipa Payload
          ls -la Moonlight-hybrid-mouse.ipa
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" Payload/Moonlight.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" Payload/Moonlight.app/Info.plist

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-hybrid-mouse-ipa
          path: ${{ runner.temp }}/Moonlight-hybrid-mouse.ipa
          if-no-files-found: error
          retention-days: 30
